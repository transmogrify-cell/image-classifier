<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Classifier</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@700;800;900&display=swap"
    />
    <link rel="stylesheet" href="css/image-classifier.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="bg-blob bg-blob--pink"></span>
      <span class="bg-blob bg-blob--cyan"></span>
      <span class="bg-blob bg-blob--lime"></span>
      <span class="bg-grid"></span>
      <span class="bg-cursor"></span>
      <span class="bg-grain"></span>
    </div>

    <main class="page">
      <!-- data-model-url: folder (or Teachable Machine share link) containing model.json, metadata.json and weights.bin -->
      <section id="image-classifier" class="ic" data-model-url="./model/" aria-labelledby="ic-title">
        <header class="ic-header">
          <h1 id="ic-title" class="ic-title">
            <span class="ic-title-fill">Image</span>
            <span class="ic-title-outline">Classifier</span>
          </h1>
          <svg class="ic-badge" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <path id="ic-badge-path" d="M60,60 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0" />
            </defs>
            <circle class="ic-badge-disc" cx="60" cy="60" r="58" />
            <text class="ic-badge-text">
              <textPath href="#ic-badge-path" textLength="280" lengthAdjust="spacing">RUNS IN YOUR BROWSER ✺ NO UPLOADS ✺</textPath>
            </text>
            <text class="ic-badge-star" x="60" y="70" text-anchor="middle">✺</text>
          </svg>
          <p class="ic-hint">Drop a photo or point your webcam at something. The model calls it, live.</p>
        </header>

        <div class="ic-tapes" aria-hidden="true">
          <div class="ic-ticker ic-ticker--pink"><span class="ic-ticker-track"></span></div>
          <div class="ic-ticker ic-ticker--lime"><span class="ic-ticker-track"></span></div>
        </div>

        <div class="ic-stage">
          <div class="ic-input">
            <div class="ic-scanner">
              <div class="ic-scanner-screen">
                <div class="ic-preview" aria-label="Image preview"></div>
                <span class="ic-corner ic-corner--tl"></span>
                <span class="ic-corner ic-corner--tr"></span>
                <span class="ic-corner ic-corner--bl"></span>
                <span class="ic-corner ic-corner--br"></span>
                <span class="ic-scanline"></span>
                <span class="ic-drop-hint">Drop it</span>
              </div>
            </div>

            <div class="ic-controls">
              <button type="button" class="ic-button ic-button--primary" data-action="upload">Upload image</button>
              <button type="button" class="ic-button" data-action="webcam">Use webcam</button>
              <input type="file" class="ic-file-input" accept="image/*" hidden />
            </div>
          </div>

          <div class="ic-output">
            <p class="ic-status" role="status" aria-live="polite"></p>

            <div class="ic-result ic-card" hidden>
              <p class="ic-top">
                <span class="ic-top-caption">Verdict</span>
                <span class="ic-top-label"></span>
                <span class="ic-top-score"></span>
              </p>
              <ul class="ic-scores" aria-label="Confidence per class"></ul>
            </div>

            <div class="ic-idle ic-card" aria-hidden="true">
              <p class="ic-idle-title">Awaiting<br />input<span class="ic-caret">_</span></p>
              <ol class="ic-idle-steps">
                <li>Drop or upload an image</li>
                <li>Or switch on the webcam</li>
                <li>Read the verdict</li>
              </ol>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Versions pinned to the pairing the Teachable Machine image library declares (peer dependency tfjs 1.3.1). -->
    <script
      src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"
      integrity="sha384-LBtUZzDp17Y7UgB/KFromf1LnY7o5ls8Oxm4vEAoTM0U+JzaadctX2/buQiNHyQU"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"
      integrity="sha384-4Q4fzaRr/bPyBiOertaWuZ8Zn987vAWqtNLbL6h+tf/Y+flpirtyqFTd7q9ELxjS"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/app.js"></script>
    <script>
      // Browsers block module scripts and model fetches on file:// pages, so say so instead of failing silently.
      if (location.protocol === 'file:') {
        const status = document.querySelector('.ic-status');
        status.textContent = 'Open this page through a web server (see README). Browsers block loading the model from file://.';
        status.dataset.kind = 'error';
      }
    </script>
  </body>
</html>
